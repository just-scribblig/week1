name: Jupyter Notebook CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        pip install jupyter nbconvert pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Check notebook syntax
      run: |
        python -m nbconvert --to python *.ipynb || echo "No notebooks found"
        
    - name: Run basic validation
      run: |
        find . -name "*.ipynb" -exec echo "Found notebook: {}" \;